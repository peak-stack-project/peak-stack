<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeakStack | Recuperação</title>
    <link rel="icon" href="./assets/react.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/recuperacao_senha.css">
    <script src="./js/sessao.js" defer></script>
</head>

<body class="corpo_autenticacao">
    <div id="gradient-waves-background" aria-hidden="true">
        <video autoplay muted loop playsinline>
            <source src="./assets/onda-fundo.webm" type="video/webm">
        </video>
    </div>
    <header class="cabecalho">
        <a class="marca" href="./index.html" aria-label="PeakStack - início">
            <span class="marca_icone"><img src="./assets/logo sem fundo.png" alt="" /></span>
            <h3>PeakStack</h3>
        </a>
        <nav class="navegacao" aria-label="Navegação principal">
            <a href="./index.html">Início</a>
            <a id="link_cadastro" href="./sobre.html">Sobre</a>
            <button id="btn_logout" class="botao_link" onclick="limparSessao()">
                Sair
            </button>
        </nav>
    </header>
    <main id="etapa_email" class="container_recuperacao">
        <section class="container_principal">
            <h1>Recuperação de Acesso PeakStack</h1>
        </section>
        <section class="sessao_recuperacao">
            <div class="formulario_cartao">


                <h2>Recupere o acesso sua conta</h2>
                <div class="alerta_erro" id="cardErroEmail">
                    <span id="mensagem_erro_email"></span>
                </div>
                <div class="campo">
                    <label for="email_input">Email</label>
                    <input id="email_input" type="email" placeholder="seu@email.com">
                </div>

                <button class="botao botao_primario botao_largo" onclick="verificarEmail()">Continuar</button>
                <p class="alternativa_formulario">Retornar?<a href="./login.html"> Login</a></p>
                <div id="div_aguardar" class="loading-div"><img src="./assets/circle-loading.gif" alt="Carregando">
                </div>
                <div id="div_erros_login"></div>
            </div>
        </section>

    </main>
    <main id="etapa_nascimento" class="container_recuperacao" style="display: none;">
        <section class="container_principal">
            <h1>Recuperação de Acesso PeakStack</h1>
        </section>

        <section class="sessao_recuperacao">

            <div class="formulario_cartao">


                <h2>Confirme a Identidade</h2>
                <div class="alerta_erro" id="cardErroNascimento">
                    <span id="mensagem_erro_nascimento"></span>
                </div>
                <div class="campo">
                    <label for="dataNascimento_input">Codigo</label>
                    <input id="dataNascimento_input" type="date" placeholder="Data Nascimento">
                </div>

                <button class="botao botao_primario botao_largo" onclick="verificarNascimento()">Continuar</button>
                <p class="alternativa_formulario">Retornar?<a href="./login.html"> Login</a></p>
                <div id="div_aguardar" class="loading-div"><img src="./assets/circle-loading.gif" alt="Carregando">
                </div>
                <div id="div_erros_login"></div>
            </div>
    </main>

    <main id="etapa_senha" class="container_nova_senha" style="display: none;">
        <section class="container_principal">
            <h1>Recuperação de Acesso PeakStack</h1>
        </section>
        <section class="sessao_recuperacao">
            <div class="formulario_cartao">


                <h2>Cadastre nova senha</h2>
                <div class="alerta_erro" id="cardErroSenha">
                    <span id="mensagem_erro_senha"></span>
                </div>

                <div class="campo">
                    <label for="senha_input">Nova senha</label>
                    <input id="senha_input" type="password" placeholder="Nova senha">
                </div>

                <div class="campo">
                    <label for="confirmarSenha_input">Confirme a senha</label>
                    <input id="confirmarSenha_input" type="password" placeholder="Confirme a senha">
                </div>
                <button class="botao botao_primario botao_largo" onclick="redefinirSenha()">
                    Redefinir senha
                </button>
    </main>
</body>

</html>

<script>


    var emailRecuperacao = "";
    var dataNascimentoRecuperacao = "";

    if (resposta.ok) {
        document.getElementById("etapa_email").style.display = "none";
        document.getElementById("etapa_nascimento").style.display = "block";
    } else {
        resposta.text().then(function (texto) {
            alert(texto);
        });
    }

    function verificarEmail() {
        aguardar();

        var emailVar = email_input.value;

        if (emailVar == "") {
            cardErroEmail.style.display = "block";
            mensagem_erro_email.innerHTML = "Informe seu e-mail.";
            finalizarAguardar();
            return false;
        }

        fetch("/recuperacao/verificar-email", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                emailServer: emailVar
            })
        }).then(function (resposta) {
            if (resposta.ok) {
                emailRecuperacao = emailVar;

                etapa_email.style.display = "none";
                etapa_nascimento.style.display = "block";
            } else {
                resposta.text().then(function (texto) {
                    cardErroEmail.style.display = "block";
                    mensagem_erro_email.innerHTML = texto;
                });
            }

            finalizarAguardar();
        }).catch(function (erro) {
            console.log(erro);
            cardErroEmail.style.display = "block";
            mensagem_erro_email.innerHTML =
                "Falha na conexão com o servidor.";
            finalizarAguardar();
        });

        return false;
    }


    function verificarNascimento() {
        aguardar();

        var dataNascimentoVar = dataNascimento_input.value;

        if (dataNascimentoVar == "") {
            cardErroNascimento.style.display = "block";
            mensagem_erro_nascimento.innerHTML =
                "Informe sua data de nascimento.";
            finalizarAguardar();
            return false;
        }

        fetch("/recuperacao/verificar-nascimento", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                emailServer: emailRecuperacao,
                dataNascimentoServer: dataNascimentoVar
            })
        }).then(function (resposta) {
            if (resposta.ok) {
                dataNascimentoRecuperacao = dataNascimentoVar;

                etapa_nascimento.style.display = "none";
                etapa_senha.style.display = "block";
            } else {
                resposta.text().then(function (texto) {
                    cardErroNascimento.style.display = "block";
                    mensagem_erro_nascimento.innerHTML = texto;
                });
            }

            finalizarAguardar();
        }).catch(function (erro) {
            console.log(erro);
            cardErroNascimento.style.display = "block";
            mensagem_erro_nascimento.innerHTML =
                "Falha na conexão com o servidor.";
            finalizarAguardar();
        });

        return false;
    }


    function redefinirSenha() {
        aguardar();

        var senhaVar = senha_input.value;
        var confirmarSenhaVar = confirmarSenha_input.value;

        if (senhaVar == "" || confirmarSenhaVar == "") {
            cardErroSenha.style.display = "block";
            mensagem_erro_senha.innerHTML =
                "Preencha os dois campos de senha.";
            finalizarAguardar();
            return false;
        }

        if (senhaVar != confirmarSenhaVar) {
            cardErroSenha.style.display = "block";
            mensagem_erro_senha.innerHTML =
                "As senhas não coincidem.";
            finalizarAguardar();
            return false;
        }

        if (senhaVar.length < 8) {
            cardErroSenha.style.display = "block";
            mensagem_erro_senha.innerHTML =
                "A senha deve ter pelo menos 8 caracteres.";
            finalizarAguardar();
            return false;
        }

        fetch("/recuperacao/redefinir-senha", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                emailServer: emailRecuperacao,
                dataNascimentoServer: dataNascimentoRecuperacao,
                senhaServer: senhaVar,
                confirmarSenhaServer: confirmarSenhaVar
            })
        }).then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(function (json) {
                    alert(json.mensagem);
                    window.location.href = "./login.html";
                });
            } else {
                resposta.text().then(function (texto) {
                    cardErroSenha.style.display = "block";
                    mensagem_erro_senha.innerHTML = texto;
                    finalizarAguardar();
                });
            }
        }).catch(function (erro) {
            console.log(erro);
            cardErroSenha.style.display = "block";
            mensagem_erro_senha.innerHTML =
                "Falha na conexão com o servidor.";
            finalizarAguardar();
        });

        return false;
    }



</script>
