<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeakStack | Recuperação</title>
    <link rel="icon" href="./assets/react.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/recuperacao_senha.css">
    <script src="./js/sessao.js" defer></script>
</head>

<body class="corpo_autenticacao" onload="registrar_checkpoint('acessou_login_peakstack')">
    <div id="gradient-waves-background" aria-hidden="true">
        <video autoplay muted loop playsinline>
            <source src="./assets/onda-fundo.webm" type="video/webm">
        </video>
    </div>
    <header class="cabecalho">
        <a class="marca" href="./index.html" aria-label="PeakStack - início">
            <span class="marca_icone"><img src="./assets/logo sem fundo.png" alt="" /></span>
            <h3>PeakStack</h3>
        </a>
        <nav class="navegacao" aria-label="Navegação principal">
            <a href="./index.html">Início</a>
            <a id="link_cadastro" href="./sobre.html">Sobre</a>
            <button id="btn_logout" class="botao_link" onclick="limparSessao()">
                Sair
            </button>
        </nav>
    </header>
    <main class="container_recuperacao">
        <section class="container_principal">
            <h1>Recuperação de Acesso PeakStack</h1>
        </section>
        <section class="sessao_recuperacao">
            <div class="formulario_cartao">


                <h2>Recupere o acesso sua conta</h2>
                <div class="alerta_erro" id="cardErro"><span id="mensagem_erro"></span></div>
                <div class="campo">
                    <label for="email_input">Email</label>
                    <input id="email_input" type="email" placeholder="seu@email.com">
                </div>

                <button class="botao botao_primario botao_largo" onclick="entrar()">Entrar</button>
                <p class="alternativa_formulario">Retornar?<a href="./login.html"> Login</a></p>
                <div id="div_aguardar" class="loading-div"><img src="./assets/circle-loading.gif" alt="Carregando">
                </div>
                <div id="div_erros_login"></div>
            </div>
        </section>
    </main>
</body>

</html>

<script>
    var fez_login = false;

    function entrar() {
        aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = "Todos os campos devem ser preenchidos";
            finalizarAguardar();
            return false;
        }

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ emailServer: emailVar, senhaServer: senhaVar })
        }).then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(function (json) {
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;

                    fez_login = true;
                    registrar_checkpoint("login_realizado_peakstack", json.id);

                    setTimeout(function () {
                        window.location = sessionStorage.TIPO == "admin" ? "/dashboard.html" : "/eventos.html";
                    }, 1200);
                });
            } else {
                resposta.text().then(function (texto) {
                    cardErro.style.display = "block";
                    mensagem_erro.innerHTML = texto + ". Tente novamente.";
                    finalizarAguardar();
                    registrar_checkpoint("erro_login_peakstack");
                });
            }
        }).catch(function () {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = "Falha na conexão com o servidor.";
            finalizarAguardar();
            registrar_checkpoint("falha_conexao_login_peakstack");
        });

        return false;
    }

    window.addEventListener("beforeunload", function () {
        if (!fez_login) registrar_checkpoint("saiu_login_sem_concluir");
    });
</script>
