<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeakStack | Usuários</title>
    <link rel="icon" href="./assets/react.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/dashboard.css">
    <link rel="stylesheet" href="./css/cadastro_usuarios.css">
    <!-- <link rel="stylesheet" href="./css/dashboard.css"> -->
    <script src="./js/sessao.js" defer></script>
</head>

<body class="corpo_dashboard">

    <!-- Barra lateral (ilha flutuante) -->
    <aside class="menu_lateral">
        <a class="marca marca_lateral">
            <img class="marca_icone" src="./assets/Design sem nome.png" alt="" />
            <span>PeakStack</span>
        </a>
        <div class="menu_grupo">
            <span class="menu_rotulo">Menu</span>
            <a href="./dashboard_visao_geral.html">Visão geral</a>
            <a href="./alertas.html">Alertas</a>
            <a href="./máquinas.html">Máquinas</a>
            <a class="ativo" href="./cadastro_usuarios.html">Usuários</a>
        </div>
        <div class="menu_lateral_rodape">
            <span class="menu_grupo">
                <a href="./index.html">Sair</a>
            </span>
            <!-- <button id="btn_logout" class="botao botao_lateral" onclick="limparSessao()">
                Sair
            </button> -->
        </div>
    </aside>
    <section class="sessao_cadastro_usuarios">
        <div class="container_cadastro_usuarios">

            <div class="container_inicial">
                <div class="texto_inicial">
                    <h3>Usuários</h3>
                    <p>Cadastros para acesso ao sistema</p>
                </div>
                <div class="container_pesquisa">
                    <input type="text" placeholder="  Buscar usuarios">
                    <button>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="black" class="bi bi-search"
                            viewBox="0 0 16 16">
                            <path
                                d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                        </svg>
                    </button>

                </div>
            </div>

            <div class="container_interacao_usuarios">
                <div class="container_status_usuarios">
                    <div class="status_usuarios">
                        <p>2 Usuários Ativos</p>
                    </div>

                </div>
                <button id="botao_cadastro_funcionarios" onclick="chamarCadastro()"> + Adicionar usuarios</button>
            </div>
            <div class="container_usuario_ativos">
                <div class="container_tabela">

                    <div class="colunas_tabela">
                        <div class="usuario">USUÁRIO</div>
                        <div class="email">E-MAIL</div>
                        <div class="empresa">EMPRESA</div>
                        <div class="perfil">PERFIL</div>
                        <div class="acoes">AÇÕES</div>
                        <div></div>
                    </div>
                    <div class="conteudo_tabela" id="lista_usuarios">
                    </div>
                </div>
            </div>
    </section>
    <section>
        <div id="container_cadastro" style="display: none;">
            <div class="sessao_cadastro">
                <div class="container_tema">
                    <h3>Cadastrar Usuários</h3>
                    <a href="./cadastro_usuarios.html">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                            class="bi bi-x-circle" viewBox="0 0 16 16">
                            <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16" />
                            <path
                                d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708" />
                        </svg>
                    </a>

                </div>

                <div class="nome_usuario">
                    <h4>Nome</h4>
                    <input type="text" id="nome_input" placeholder="   Nome e Sobrenome">
                </div>
                <div class="email_usuario">
                    <div class="email">
                        <H4>Email</H4>
                        <input type="text" id="email_input" placeholder="   usuario@empresa.com">
                    </div>
                </div>
                <div class="senha">
                    <h4>Senha</h4>
                    <input type="password" id="senha_input" placeholder="   Mínimo 6 caracteres">
                </div>
                <div class="senha">
                    <h4>Confirmar senha</h4>
                    <input type="password" id="confirmacao_senha_input" placeholder="   Mínimo 6 caracteres">
                </div>
                <div class="container_empresa_usuario">
                    <h4>Data de nascimento</h4>
                    <input type="text" id="data_input" placeholder="   YYYY-MM-DD">
                </div>
                <div class="container_atividade_usuario">
                    <h4>Cargo</h4>
                    <select id="cargo_input">
                        <option value="1">Administrador</option>
                        <option value="2">Visualizador</option>
                        <option value="3">Operador</option>
                    </select>
                </div>
                <div class="botoes_modal_cadastro">
                    <button class="botao_cancelar_cadastro_usuario" onclick="chamarCadastro()">Cancelar</button>
                    <button class="botao_cadastrar_usuario" onclick="cadastrarUsuario()">Cadastrar</button>
                </div>
            </div>
        </div>
    </section>
    <div id="modalEdicaoUsuario" class="modal_edicao" style="display: none;">

        <section class="modal_edicao_cartao">

            <header class="modal_edicao_cabecalho">
                <h2>Editar usuário</h2>

                <button type="button" class="modal_edicao_fechar" data-fechar-modal>
                    &times;
                </button>
            </header>

            <form id="formEdicaoUsuario" class="form_edicao_empresa">

                <label for="edicaoNomeUsuario">Nome</label>
                <div class="campo_edicao">
                    <input id="edicaoNomeUsuario" type="text">
                </div>

                <label for="edicaoEmailUsuario">E-mail</label>
                <div class="campo_edicao">
                    <input id="edicaoEmailUsuario" type="email">
                </div>

                <label for="edicaoDataUsuario">Data de nascimento</label>
                <div class="campo_edicao">
                    <input id="edicaoDataUsuario" type="date">
                </div>

                <label for="edicaoCargoUsuario">Cargo</label>
                <div class="campo_edicao">
                    <select id="edicaoCargoUsuario">
                        <option value="1">Administrador</option>
                        <option value="2">Visualizador</option>
                        <option value="3">Operador</option>
                    </select>
                </div>

                <div class="acoes_edicao">
                    <button class="botao_cancelar_edicao" type="button" data-fechar-modal>
                        Cancelar
                    </button>

                    <button class="botao_atualizar_edicao" type="submit">
                        Atualizar usuário
                    </button>
                </div>

            </form>
        </section>
    </div>
</body>

</html>
<script>
    function listarUsuarios() {

        fetch("/usuarios/listarUsuarios")
            .then(function (resposta) {
                return resposta.json();
            })
            .then(function (json) {

                let htmlCodigo = "";

                for (let i = 0; i < json.length; i++) {

                    htmlCodigo += `
                    <div class="linha_tabela">

                        <div class="campo_usuario">
                            <div>${json[i].nome}</div>
                        </div>

                        <div class="texto_email">
                            ${json[i].email}
                        </div>

                        <div class="texto_empresa">
                            ${json[i].empresa}
                        </div>

                        <div>
                            <div class="area_usuario">
                                ${json[i].cargo}
                            </div>
                        </div>

                        <div class="container_acoes">

                            <button type="button" onclick="editarUsuario(${json[i].id})">
                                <svg xmlns="http://www.w3.org/2000/svg"
                                    width="16" height="16" fill="currentColor"
                                    viewBox="0 0 16 16">
                                    <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293z"/>
                                    <path d="M13.752 4.396l-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12z"/>
                                </svg>
                            </button>

                             <button type="button" onclick="deletarUsuario(${json[i].id})">
                                <svg xmlns="http://www.w3.org/2000/svg"
                                    width="16" height="16" fill="currentColor"
                                    viewBox="0 0 16 16">
                                    <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293z"/>
                                    <path d="M13.752 4.396l-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12z"/>
                                </svg>
                            </button>

                        </div>

                    </div>
                `;
                }

                lista_usuarios.innerHTML = htmlCodigo;

            })
            .catch(function (erro) {
                console.error("Erro ao listar usuários:", erro);
            });
    }

    listarUsuarios();
    const modalUsuario = document.getElementById("modalEdicaoUsuario");

    let idUsuario;

    function editarUsuario(id) {

        idUsuario = id;

        fetch(`/usuarios/buscar/${id}`)
            .then(function (resposta) {
                return resposta.json();
            })
            .then(function (json) {

                edicaoNomeUsuario.value = json.nome;
                edicaoEmailUsuario.value = json.email;

                edicaoDataUsuario.value = json.data.substring(0, 10);

                edicaoCargoUsuario.value = json.fk_cargo;

                modalUsuario.style.display = "flex";

            })
            .catch(function (erro) {
                console.error("Erro ao buscar usuário:", erro);
            });
    }

    function deletarUsuario(id) {

        idUsuarioVar = id;

        fetch("/usuarios/deletar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    // crie um atributo que recebe o valor recuperado aqui
                    // Agora vá para o arquivo routes/usuario.js
                    idUsuarioServer: idUsuarioVar
                }),
            })
                .then(function (resposta) {
                    console.log("resposta: ", resposta);

                    if (resposta.ok) {
                        listarUsuarios();
                        cardErro.style.display = "block";

                        mensagem_erro.innerHTML =
                            "Usuário deletado com sucesso!";
                    } else {
                        throw "Houve um erro ao tentar deletar o usuário!";
                    }
                })
                .catch(function (resposta) {
                    console.log(`#ERRO: ${resposta}`);
                });

            return false;

    }


    function fecharModalUsuario() {
        modalUsuario.style.display = "none";
    }

    document.querySelectorAll("#modalEdicaoUsuario [data-fechar-modal]")
        .forEach(function (botao) {
            botao.addEventListener("click", fecharModalUsuario);
        });

    function chamarCadastro() {
        const container = document.getElementById("container_cadastro");

        if (container.style.display === "none") {
            container.style.display = "flex";
        } else {
            container.style.display = "none";
        }
    }

    document.getElementById("formEdicaoUsuario")
        .addEventListener("submit", function (event) {

            event.preventDefault();

            let nome = edicaoNomeUsuario.value;
            let email = edicaoEmailUsuario.value;
            let data = edicaoDataUsuario.value;
            let cargo = edicaoCargoUsuario.value;

            if (nome.length < 3 || email == "" || data == "" || cargo == "") {
                alert("Preencha todos os campos corretamente.");
                return;
            }

            fetch(`/usuarios/atualizar/${idUsuario}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nome: nome,
                    email: email,
                    data: data,
                    fk_cargo: cargo
                })
            })
                .then(function (resposta) {

                    if (resposta.ok) {
                        alert("Usuário atualizado com sucesso!");

                        fecharModalUsuario();
                        listarUsuarios();

                    } else {
                        alert("Erro ao atualizar usuário.");
                    }

                })
                .catch(function (erro) {
                    console.error("Erro ao atualizar usuário:", erro);
                });

        });

    function cadastrarUsuario() {

        let booleano = true;
        var nomeVar = nome_input.value;
        var emailVar = email_input.value;
        var senhaVar = senha_input.value;
        var confirmacaoSenhaVar = confirmacao_senha_input.value;
        var cargoVar = cargo_input.value
        var idEmpresaVar = sessionStorage.getItem("FKEMPRESA_USUARIO");
        var dataVar = data_input.value;
        var nomeUsuarioVar = sessionStorage.getItem("NOME_USUARIO")



        // Verificando se há algum campo em branco
        if (
            nomeVar == "" ||
            emailVar == "" ||
            senhaVar == "" ||
            confirmacaoSenhaVar == "" ||
            cargoVar == "" ||
            idEmpresaVar == "" ||
            dataVar == ""
            ||
            nomeUsuarioVar == ""
        ) {
            booleano = false;
        }

        // Enviando o valor da nova input
        if (senhaVar == confirmacaoSenhaVar && booleano == true) {
            fetch("/usuarios/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    // crie um atributo que recebe o valor recuperado aqui
                    // Agora vá para o arquivo routes/usuario.js
                    nomeServer: nomeVar,
                    emailServer: emailVar,
                    senhaServer: senhaVar,
                    cargoServer: cargoVar,
                    idempresaServer: idEmpresaVar,
                    dataServer: dataVar,
                    nomeUsuarioServer: nomeUsuarioVar
                }),
            })
                .then(function (resposta) {
                    console.log("resposta: ", resposta);

                    if (resposta.ok) {
                        cardErro.style.display = "block";

                        mensagem_erro.innerHTML =
                            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

                        setTimeout(() => {
                            window.location = "login.html";
                        }, "2000");

                        limparFormulario();
                        finalizarAguardar();
                    } else {
                        throw "Houve um erro ao tentar realizar o cadastro!";
                    }
                })
                .catch(function (resposta) {
                    console.log(`#ERRO: ${resposta}`);
                    finalizarAguardar();
                });

            return false;
        }

    }
</script>
