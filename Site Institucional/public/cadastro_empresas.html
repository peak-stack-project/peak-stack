<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeakStack | Cadastro</title>
    <link rel="icon" href="./assets/react.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/cadastro.css">
    <link rel="stylesheet" href="">
    <script src="./js/sessao.js" defer></script>
</head>

<body class="corpo_autenticacao" onload="registrar_checkpoint('acessou_cadastro_peakstack')">

    <div id="gradient-waves-background" aria-hidden="true">
        <video autoplay muted loop playsinline>
            <source src="./assets/onda-fundo.webm" type="video/webm">
        </video>
    </div>
    <header class="cabecalho">
        <a class="marca" href="./index.html"><span class="marca_icone"><img src="./assets/logo sem fundo.png"
                    alt=""></span>
            <span>PeakStack</span></a>
    </header>
        <main class="pagina_formulario pagina_autenticacao">

        <section class="formulario_contexto">
            <h1>Olá Administrador PeakStack!</h1>
        </section>

        <section class="container_cadastro">
            <div class="formulario_cartao formulario_cadastro">
                
                <div id="cadastroEmpresa">
                    <h2>Cadastro Empresa</h2>
                    <div class="campo">
                        <label for="razao_social_input">Razão Social</label>
                        <input id="razao_social_input" type="text" placeholder="Razão Social da empresa">
                    </div>
                    <div class="campo">
                        <label for="nome_fantasia_input">Nome Fantasia</label>
                        <input id="nome_fantasia_input" type="text" placeholder="Nome Fantasia da empresa">
                    </div>
                    <div class="campo">
                        <label for="cnpj_input">CNPJ</label>
                        <input id="cnpj_input" type="text" placeholder="00.000.000/0001-00">
                    </div>
                    <div class="campo_botao">
                        <button type="button" class="botao botao_primario botao_largo" id="btnProximo" onclick="passarContainer()">Próximo</button>
                    </div>
                </div>

                <div id="cadastroADM" style="display: none;">
                    <h2>Cadastro Administrador</h2>
                    <div class="alerta_erro" id="cardErro"><span id="mensagem_erro"></span></div>
                    
                    <div class="campo">
                        <label for="nome_input">Nome</label>
                        <input id="nome_input" type="text" placeholder="Nome completo">
                    </div>
                    <div class="campo">
                        <label for="email_input">E-mail</label>
                        <input id="email_input" type="email" placeholder="nome@email.com">
                    </div>
                    
                    <div class="linha_campos">
                        <div class="campo">
                            <label for="senha_input">Senha</label>
                            <div class="input-container">
                                <input id="senha_input" type="password" placeholder="Senha">
                                <button type="button" class="btn-toggle-senha" onclick="toggleSenha('senha_input', this)">👁️</button>
                            </div>
                        </div>

                        <div class="campo">
                            <label for="confirmacao_senha_input">Confirmar senha</label>
                            <div class="input-container">
                                <input id="confirmacao_senha_input" type="password" placeholder="Repita a senha">
                                <button type="button" class="btn-toggle-senha" onclick="toggleSenha('confirmacao_senha_input', this)">👁️</button>
                            </div>
                        </div>
                    </div>

                    <div class="linha_campos">
                        <div class="campo">
                            <label for="cargo_input">Cargo</label>
                            <input id="cargo_input" type="text" placeholder="Cargo">
                        </div>
                        <div class="campo">
                            <label for="idempresa_input">ID da empresa</label>
                            <input id="idempresa_input" type="text" placeholder="ID da Empresa">
                        </div>
                    </div>

                    <button class="botao botao_primario botao_largo" onclick="cadastrar()">Criar conta</button>
                    <p class="alternativa_formulario">Já possui conta? <a href="./login.html">Entrar</a></p>
                    
                    <div id="div_aguardar" class="loading-div">
                        <img src="./assets/circle-loading.gif" alt="Carregando">
                    </div>
                    <div id="div_erros_login"></div>
                </div>

            </div>
        </section>
    </main>
</body>

</html>

<script>
    var cadastro_realizado = false;

    function cadastrar() {
        var nomeVar = nome_input.value;
        var emailVar = email_input.value;
        var senhaVar = senha_input.value;
        var confirmacaoSenhaVar = confirmacao_senha_input.value;
        var cargoVar = cargo_input.value;
        var idempresaVar = idempresa_input.value

        if (nomeVar == "" || emailVar == "" || cargoVar == "" || senhaVar == "" || confirmacaoSenhaVar == "" || idempresaVar == "") {
            return exibirErroCadastro("Todos os campos devem ser preenchidos");
        } else if (!emailVar.includes("@") || !emailVar.includes(".")) {
            return exibirErroCadastro("Insira um e-mail válido");
        } else if (senhaVar.length < 8) {
            return exibirErroCadastro("A senha deve ter pelo menos 8 caracteres");
        } else if (senhaVar.includes(" ")) {
            return exibirErroCadastro("A senha não pode conter espaços");
        } else if (!/[a-z]/.test(senhaVar) || !/[A-Z]/.test(senhaVar)) {
            return exibirErroCadastro("A senha deve conter letra maiúscula e minúscula");
        } else if (!/[0-9]/.test(senhaVar)) {
            return exibirErroCadastro("A senha deve conter número");
        } else if (!/[^a-zA-Z0-9]/.test(senhaVar)) {
            return exibirErroCadastro("A senha deve conter caractere especial");
        } else if (senhaVar != confirmacaoSenhaVar) {
            return exibirErroCadastro("As senhas estão diferentes");
        }

        aguardar();

        fetch("/usuarios/cadastrar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                nomeServer: nomeVar,
                emailServer: emailVar,
                senhaServer: senhaVar,
                cargoServer: cargoVar,
                idempresaServer: idempresaVar
            })
        }).then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(function (json) {
                    cadastro_realizado = true;
                    registrar_checkpoint("cadastro_realizado_peakstack", json.insertdId);
                    mensagem_erro.innerHTML = "Cadastro realizado. Redirecionando para o login...";
                    cardErro.style.display = "block";
                    finalizarAguardar();
                    setTimeout(function () { window.location = "login.html"; }, 1200);
                });
            } else {
                resposta.text().then(function (texto) {
                    exibirErroCadastro(texto.includes("Duplicate entry") ? "E-mail já cadastrado" : "Não foi possível realizar o cadastro");
                    registrar_checkpoint("erro_cadastro_peakstack");
                    finalizarAguardar();
                });
            }
        }).catch(function () {
            exibirErroCadastro("Falha na conexão com o servidor");
            registrar_checkpoint("falha_conexao_cadastro_peakstack");
            finalizarAguardar();
        });

        return false;
    }

    function exibirErroCadastro(mensagem) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = mensagem;
        return false;
    }


    function toggleSenha(inputId, botao) {
        const input = document.getElementById(inputId);

        if (input.type === "password") {
            input.type = "text";
            botao.textContent = "🔒";
        } else {
            input.type = "password";
            botao.textContent = "👁️";
        }
    }

    document.getElementById('btnProximo').addEventListener('click', function () {
        var cadastroEmpresa = document.getElementById('cadastroEmpresa');
        var cadastroADM = document.getElementById('cadastroADM');

        if (cadastroEmpresa && cadastroADM) {
            cadastroEmpresa.style.display = 'none';
            cadastroADM.style.display = 'block';
        }
    });

</script>
