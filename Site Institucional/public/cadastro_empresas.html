<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeakStack | Cadastro</title>
    <link rel="icon" href="./assets/react.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/cadastro.css">
    <link rel="stylesheet" href="">
    <script src="./js/sessao.js" defer></script>
</head>

<body class="corpo_autenticacao">

    <div id="gradient-waves-background" aria-hidden="true">
        <video autoplay muted loop playsinline>
            <source src="./assets/onda-fundo.webm" type="video/webm">
        </video>
    </div>
    <header class="cabecalho">
        <a class="marca" href="./index.html"><span class="marca_icone"><img src="./assets/logo sem fundo.png"
                    alt=""></span>
            <span>PeakStack</span></a>
    </header>
    <main class="pagina_formulario pagina_autenticacao">

        <section class="formulario_contexto">
            <h1>Olá Administrador PeakStack!</h1>
        </section>

        <section class="container_cadastro">
            <div class="formulario_cartao formulario_cadastro">

                <div id="cadastroEmpresa">
                    <h2>Cadastro Empresa</h2>
                    <div class="campo">
                        <label for="razao_social_input">Razão Social</label>
                        <input id="razao_social_input" type="text" placeholder="Razão Social da empresa">
                    </div>
                    <div class="campo">
                        <label for="nome_fantasia_input">Nome Fantasia</label>
                        <input id="nome_fantasia_input" type="text" placeholder="Nome Fantasia da empresa">
                    </div>
                    <div class="campo">
                        <label for="cnpj_input">CNPJ</label>
                        <input id="cnpj_input" type="text" placeholder="00.000.000/0001-00">
                    </div>
                    <div class="campo_botao">
                        <button type="button" class="botao botao_primario botao_largo" id="btnProximo"
                            onclick="cadastrar()">Próximo</button>
                    </div>
                </div>

                <div id="cadastroADM" style="display: none;">
                    <h2>Cadastro Administrador</h2>
                    <div class="alerta_erro" id="cardErro"><span id="mensagem_erro"></span></div>

                    <div class="campo">
                        <label for="nome_input">Nome</label>
                        <input id="nome_input" type="text" placeholder="Nome completo">
                    </div>
                    <div class="campo">
                        <label for="email_input">E-mail</label>
                        <input id="email_input" type="email" placeholder="nome@email.com">
                    </div>

                    <div class="linha_campos">
                        <div class="campo">
                            <label for="senha_input">Senha</label>
                            <div class="input-container">
                                <input id="senha_input" type="password" placeholder="Senha">
                                <button type="button" class="btn-toggle-senha"
                                    onclick="toggleSenha('senha_input', this)">👁️</button>
                            </div>
                        </div>

                        <div class="campo">
                            <label for="confirmacao_senha_input">Confirmar senha</label>
                            <div class="input-container">
                                <input id="confirmacao_senha_input" type="password" placeholder="Repita a senha">
                                <button type="button" class="btn-toggle-senha"
                                    onclick="toggleSenha('confirmacao_senha_input', this)">👁️</button>
                            </div>
                        </div>
                    </div>

                    <div class="linha_campos">
                        <div class="campo">
                            <label for="cargo_input">Cargo</label>
                            <input id="cargo_input" type="text" placeholder="Cargo">
                        </div>
                        <div class="campo">
                            <label for="data_input">Data de nascimento</label>
                            <input id="data_input" type="text" placeholder="YYYY-MM-DD">
                        </div>
                    </div>

                    <button class="botao botao_primario botao_largo" onclick="cadastrar()">Criar conta</button>
                    <p class="alternativa_formulario">Já possui conta? <a href="./login.html">Entrar</a></p>

                    <div id="div_aguardar" class="loading-div">
                        <img src="./assets/circle-loading.gif" alt="Carregando">
                    </div>
                    <div id="div_erros_login"></div>
                </div>

            </div>
        </section>
    </main>
</body>

</html>

<script>
    var cadastro_realizado = false;


    function mudarTela() {
        document.getElementById('btnProximo').addEventListener('click', function () {
            var cadastroEmpresa = document.getElementById('cadastroEmpresa');
            var cadastroADM = document.getElementById('cadastroADM');

            if (cadastroEmpresa && cadastroADM) {
                
            }
        });

    }

    function cadastrar() {
        console.log("chamei a funcao cadastrar");
        var razaoSocialVar = razao_social_input.value;
        var nomeVar = nome_fantasia_input.value;
        var cnpjVar = cnpj_input.value;
        var booleano = true;

        // aguardar();

        if (
            nomeVar == "" ||
            cnpjVar == "" ||
            razaoSocialVar == ""
        ) {
            booleano = false;
        }

        console.log(nomeVar)
        console.log(cnpjVar)
        console.log(razaoSocialVar)
        console.log(booleano)

        if (booleano == true) {
            fetch("/empresas/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({

                    // crie um atributo que recebe o valor recuperado aqui
                    // Agora vá para o arquivo routes/usuario.js
                    nomeServer: nomeVar,
                    cnpjServer: cnpjVar,
                    razaoSocialServer: razaoSocialVar,

                }),

            })
                .then(function (resposta) {
                    console.log("chamei as variavel");
                    console.log("resposta: ", resposta);

                    if (resposta.ok) {
                        console.log("resposta ok");
                        cadastroEmpresa.style.display = 'none';
                cadastroADM.style.display = 'block';
                        limparFormulario();
                        finalizarAguardar();
                        
                    } else {
                        throw "Houve um erro ao tentar realizar o cadastro!";
                    }
                })
                .catch(function (resposta) {
                    console.log(`#ERRO: ${resposta}`);
                    finalizarAguardar();
                });

            return false;
        }
    }


    function exibirErroCadastro(mensagem) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = mensagem;
        return false;
    }


    function toggleSenha(inputId, botao) {
        const input = document.getElementById(inputId);

        if (input.type === "password") {
            input.type = "text";
            botao.textContent = "🔒";
        } else {
            input.type = "password";
            botao.textContent = "👁️";
        }
    }



</script>
