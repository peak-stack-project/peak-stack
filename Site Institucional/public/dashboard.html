<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeakStack | Monitoramento</title>
    <link rel="icon" href="./assets/icon/favicon2.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/dashboard.css">
    <script src="./js/sessao.js" defer></script>
</head>
<body class="corpo_dashboard" onload="registrar_checkpoint('acessou_monitoramento_vazio')">
 <aside class="menu_lateral">
        <a class="marca marca_lateral">
            <img class="marca_icone" src="./assets/Design sem nome.png" alt="" />
            <span>PeakStack</span>
        </a>
        <div class="menu_grupo">
            <span class="menu_rotulo">Menu</span>
            <a class="ativo" href="./dashboard.html">Visão geral</a>
            <a href="./máquinas.html">Máquinas</a>
            <a href="./cadastroUsuarios.html">Usuários</a>
            <a href="./alertas.html">Alertas</a>
        </div>
        <div class="menu_lateral_rodape">
            <span class="menu_grupo">
                <a href="./index.html">Sair</a>
            </span>
            <button id="btn_logout" class="botao botao_lateral" onclick="limparSessao()">
                Sair
            </button>
        </div>
    </aside>
    <main class="conteudo_dashboard">
        <header class="topo_dashboard">
            <div><span class="etiqueta">PeakStack</span><h1>Monitoramento</h1></div>
        </header>
        <section class="area_monitoramento_vazia" aria-label="Área vazia reservada para o monitoramento"></section>
    </main>
</body>
<script>

    const ctx = document.getElementById('graficoCpu');

    new Chart(ctx, {
        type: 'line',

        data: {
            labels: [
                '00:00h',
                '01:00h',
                '02:00h',
                '03:00h',
                '04:00h',
                '05:00h',
                '06:00h',
                '07:00h',
                '08:00h',
                '09:00h',
                '10:00h',
                '11:00h',
                '12:00h',
                '13:00h',
                '14:00h',
                '15:00h',
                '16:00h',
                '17:00h',
                '18:00h',
                '19:00h',
                '20:00h',
                '21:00h',
                '22:00h',
                '23:00h'
            ],

            datasets: [
                {
                    label: 'Uso de CPU (%)',

                    data: [
                        32,
                        45,
                        38,
                        67,
                        54,
                        72,
                        78,
                        32,
                        46,
                        80,
                        21,
                        54,
                        72,
                        41,
                        34,
                        75,
                        38,
                        87,
                        14,
                        72,
                        61
                    ],

                    borderWidth: 2,

                    tension: 0.4,

                    fill: false
                }
            ]
        },

        options: {
            responsive: true,

            maintainAspectRatio: false,

            scales: {
                y: {
                    beginAtZero: true,
                    max: 100,
                    ticks: {
                        stepSize: 25
                    },
                    grid: {
                        drawOnChartArea: true
                    },
                    title: {
                        display: true,
                        text: 'CPU (%)'
                    }
                },
                x: {
                    grid: {
                        drawOnChartArea: false
                    },
                    title: {
                        display: true,
                        text: 'Horário'
                    }
                }
            },

            plugins: {
                legend: {
                    display: true
                }
            }
        }
    });



</script>

</body>

</html>
