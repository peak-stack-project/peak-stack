<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeakStack | Cadastro</title>
    <link rel="icon" href="./assets/icon/favicon2.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/peakstack.css">
    <script src="./js/sessao.js" defer></script>
</head>
<body class="corpo_autenticacao" onload="registrar_checkpoint('acessou_cadastro_peakstack')">
    <header class="cabecalho cabecalho_claro">
        <a class="marca" href="./index.html"><span class="marca_icone">PS</span><span>PeakStack</span></a>
        <nav class="navegacao"><a href="./index.html">Início</a><a href="./login.html">Entrar</a></nav>
    </header>
    <main class="pagina_formulario pagina_autenticacao">
        <section class="formulario_contexto">
            <span class="etiqueta etiqueta_clara">Comece por aqui</span>
            <h1>Crie seu acesso ao PeakStack.</h1>
            <p>Mantivemos os campos do projeto-base para preservar o aprendizado e os caminhos existentes.</p>
        </section>
        <section class="formulario_cartao formulario_cadastro">
            <span class="etiqueta">Cadastro</span>
            <h2>Crie sua conta</h2>
            <div class="alerta_erro" id="cardErro"><span id="mensagem_erro"></span></div>
            <div class="campo"><label for="nome_input">Nome</label><input id="nome_input" type="text" placeholder="Seu nome completo"></div>
            <div class="campo"><label for="email_input">E-mail</label><input id="email_input" type="email" placeholder="seu@email.com"></div>
            <div class="campo"><label for="data_nascimento_input">Data de nascimento</label><input id="data_nascimento_input" type="date"></div>
            <fieldset class="campo campo_genero">
                <legend>Gênero</legend>
                <label><input type="radio" name="genero" value="M"> Masculino</label>
                <label><input type="radio" name="genero" value="F"> Feminino</label>
                <label><input type="radio" name="genero" value="O"> Outro</label>
            </fieldset>
            <div class="linha_campos">
                <div class="campo"><label for="senha_input">Senha</label><input id="senha_input" type="password" placeholder="Sua senha"></div>
                <div class="campo"><label for="confirmacao_senha_input">Confirmar senha</label><input id="confirmacao_senha_input" type="password" placeholder="Repita a senha"></div>
            </div>
            <button class="botao botao_primario botao_largo" onclick="cadastrar()">Criar conta</button>
            <p class="alternativa_formulario">Já possui conta? <a href="./login.html">Entrar</a></p>
            <div id="div_aguardar" class="loading-div"><img src="./assets/circle-loading.gif" alt="Carregando"></div>
            <div id="div_erros_login"></div>
        </section>
    </main>
</body>
</html>

<script>
    var cadastro_realizado = false;

    function cadastrar() {
        var nomeVar = nome_input.value;
        var emailVar = email_input.value;
        var data_nascimentoVar = data_nascimento_input.value;
        var senhaVar = senha_input.value;
        var confirmacaoSenhaVar = confirmacao_senha_input.value;
        var generoSelecionado = document.querySelector('input[name="genero"]:checked');
        var generoVar = generoSelecionado ? generoSelecionado.value : "";
        var tipoVar = "comum";

        if (nomeVar == "" || emailVar == "" || data_nascimentoVar == "" || generoVar == "" || senhaVar == "" || confirmacaoSenhaVar == "") {
            return exibirErroCadastro("Todos os campos devem ser preenchidos");
        } else if (!emailVar.includes("@") || !emailVar.includes(".")) {
            return exibirErroCadastro("Insira um e-mail válido");
        } else if (senhaVar.length < 8) {
            return exibirErroCadastro("A senha deve ter pelo menos 8 caracteres");
        } else if (senhaVar.includes(" ")) {
            return exibirErroCadastro("A senha não pode conter espaços");
        } else if (!/[a-z]/.test(senhaVar) || !/[A-Z]/.test(senhaVar)) {
            return exibirErroCadastro("A senha deve conter letra maiúscula e minúscula");
        } else if (!/[0-9]/.test(senhaVar)) {
            return exibirErroCadastro("A senha deve conter número");
        } else if (!/[^a-zA-Z0-9]/.test(senhaVar)) {
            return exibirErroCadastro("A senha deve conter caractere especial");
        } else if (senhaVar != confirmacaoSenhaVar) {
            return exibirErroCadastro("As senhas estão diferentes");
        }

        aguardar();

        fetch("/usuarios/cadastrar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                nomeServer: nomeVar,
                emailServer: emailVar,
                generoServer: generoVar,
                data_nascimentoServer: data_nascimentoVar,
                senhaServer: senhaVar,
                tipoServer: tipoVar
            })
        }).then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(function (json) {
                    cadastro_realizado = true;
                    registrar_checkpoint("cadastro_realizado_peakstack", json.insertdId);
                    mensagem_erro.innerHTML = "Cadastro realizado. Redirecionando para o login...";
                    cardErro.style.display = "block";
                    finalizarAguardar();
                    setTimeout(function () { window.location = "login.html"; }, 1200);
                });
            } else {
                resposta.text().then(function (texto) {
                    exibirErroCadastro(texto.includes("Duplicate entry") ? "E-mail já cadastrado" : "Não foi possível realizar o cadastro");
                    registrar_checkpoint("erro_cadastro_peakstack");
                    finalizarAguardar();
                });
            }
        }).catch(function () {
            exibirErroCadastro("Falha na conexão com o servidor");
            registrar_checkpoint("falha_conexao_cadastro_peakstack");
            finalizarAguardar();
        });

        return false;
    }

    function exibirErroCadastro(mensagem) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = mensagem;
        return false;
    }

    window.addEventListener("beforeunload", function () {
        if (!cadastro_realizado) registrar_checkpoint("saiu_cadastro_sem_concluir");
    });
</script>
