<script>
    const telaMaquina = document.getElementById("tela_maquinas");
    const telaUsuarios = document.getElementById("tela_usuarios");
    const contadorCritico = document.getElementById("contador_critico");
    const contadorAlerta = document.getElementById("contador_alerta");
    const contadorNormal = document.getElementById("contador_normal");
    const contadorPendentes = document.getElementById("contador_pendentes");
    const listaAlertas = document.getElementById("lista_alertas");

    function carregando(){
        if(sessionStorage.FKCARGO_USUARIO == 2){
            telaMaquina.style.display = "none";
            telaUsuarios.style.display = "none";
        } else if(sessionStorage.FKCARGO_USUARIO == 3){
            telaUsuarios.style.display = "none";
        }
    }
    function classeDoAlerta(situacao) {
        if (situacao === "Crítico") return "critico";
        if (situacao === "Alerta") return "atencao";
        return "normal";
    }

    function atualizarResumo(alertas) {
        contadorCritico.textContent = `${alertas.filter(alerta => alerta.situacao === "Crítico").length} Crítico`;
        contadorAlerta.textContent = `${alertas.filter(alerta => alerta.situacao === "Alerta").length} Atenção`;
        contadorNormal.textContent = `${alertas.filter(alerta => alerta.situacao === "Normal").length} Info`;
        contadorPendentes.textContent = `PENDENTES · ${alertas.length}`;
    }

    function listarAlerta() {
        const idEmpresa = sessionStorage.FKEMPRESA_USUARIO;

        if (!idEmpresa) {
            console.error("ID da empresa não encontrado no sessionStorage. Redirecionando para o login...");
            return;
        }

        fetch(`/alerta/listarAlerta/${idEmpresa}`)
            .then(function (resposta) {
                if (resposta.status == 204) {
                    atualizarResumo([]);
                    listaAlertas.innerHTML = "<p>Nenhum alerta encontrado.</p>";
                    return;
                }

                if (resposta.ok) {
                    resposta.json().then(function (json) {
                        let htmlCodigo = "";
                        atualizarResumo(json);

                        for (let i = 0; i < json.length; i++) {
                            let alertaAtual = json[i];
                            let dataFormatada = new Date(alertaAtual.dt_hr_leitura).toLocaleString('pt-BR');
                            let classe = classeDoAlerta(alertaAtual.situacao);
                            htmlCodigo += `
                                <div class="alerta ${classe}">
                                    <svg class="alerta_icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                        <path d="m12 3 9 17H3L12 3Z" />
                                        <path d="M12 9v5M12 17h.01" />
                                    </svg>
                                    <div class="alerta_texto">
                                        <div class="alerta_info">
                                            <span class="gravidade">${alertaAtual.situacao}</span>
                                            <span class="servidor">${alertaAtual.nome_maquina}</span>
                                        </div>
                                        <div>${alertaAtual.descricao}</div>
                                    </div>
                                    <div class="alerta_lado">
                                        <span class="horario">${dataFormatada}</span>
                                        <button class="botao_ciente" onclick="marcarCiente(${json[i].id_discretizada})">✓ Ciente</button>
                                    </div>
                                </div>
                            `;
                        }

                        console.log(json);
                        listaAlertas.innerHTML = htmlCodigo;
                    });
                }
            })
            .catch(erro => console.error('Erro ao listar alertas:', erro));
    }

function marcarCiente(idDiscretizada) {
    fetch(`/alerta/marcarCiente/${idDiscretizada}`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            idEmpresa: sessionStorage.FKEMPRESA_USUARIO
        })
    })
    .then(function (resposta) {
        if (resposta.ok) {
            listarAlerta();
        } else {
            console.error("Erro ao marcar alerta como ciente.");
        }
    })
    .catch(erro => console.error("Erro na requisição:", erro));
}

function marcarTodosCientes() {
    fetch("/alerta/marcarCienteTodos", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ idEmpresa: sessionStorage.FKEMPRESA_USUARIO })
    })
    .then(function (resposta) {
        if (resposta.ok) listarAlerta();
        else console.error("Erro ao marcar todos os alertas como ciente.");
    })
    .catch(erro => console.error("Erro na requisição:", erro));
}

    listarAlerta();
    setInterval(listarAlerta, 10000);
</script>
