<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeakStack | Monitoramento</title>
    <link rel="icon" href="./assets/icon/favicon2.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/dashboard.css">
    <link rel="stylesheet" href="./css/cadastro_usuarios.css">
    <script src="./js/sessao.js" defer></script>
</head>

<body class="corpo_dashboard" onload="registrar_checkpoint('acessou_monitoramento_vazio')">
    <aside class="menu_lateral">
        <a class="marca marca_lateral" href="./index.html"><span class="marca_icone">PS</span><span>PeakStack</span></a>
        <div class="menu_grupo">
            <span class="menu_rotulo">Menu</span>
            <a class="ativo" href="./dashboard.html">Visão geral</a>
            <a href="./eventos.html">Minnhas máquinas</a>
            <a href="./CadastrodeVM.html">Configurar máquina</a>
        </div>
        <div class="menu_lateral_rodape">
            <a href="./index.html">Voltar para a Home</a>
            <button id="btn_logout" class="botao botao_lateral" onclick="limparSessao()">Sair</button>
        </div>
    </aside>
    <section class="sessao_cadastro_usuarios">
        <div class="container_cadastro_usuarios">

            <div class="container_inicial">
                <div class="texto_inicial">
                    <h3>Usuários</h3>
                    <p>Cadastros para acesso ao sistema</p>
                </div>
                <div class="container_pesquisa">
                    <input type="text" placeholder="  Buscar usuarios">
                    <button>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="black" class="bi bi-search"
                            viewBox="0 0 16 16">
                            <path
                                d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                        </svg></button>
                </div>
            </div>

            <div class="container_interacao_usuarios">
                <div class="container_status_usuarios">
                    <div class="status_usuarios">
                        <p>2 Usuários Ativos</p>
                    </div>
                    <div class="status_usuarios">
                        <p>1 Inativos</p>
                    </div>
                </div>
                <button id="botao_cadastro_funcionarios"> + Adicionar usuarios</button>
            </div>
            <div class="container_usuario_ativos">
                <div class="container_tabela">

                    <div class="colunas_tabela">
                        <div class="usuario">USUÁRIO</div>
                        <div class="email">E-MAIL</div>
                        <div class="empresa">EMPRESA</div>
                        <div class="perfil">PERFIL</div>
                        <div class="estado">STATUS</div>
                        <div></div>
                    </div>
                    <div class="conteudo_tabela" id="lista_usuarios">

                        <div class="linha_tabela">
                            <div class="campo_usuario">
                                <div>Isabella White</div>
                            </div>
                            <div class="texto_email">isabella@socialpulse.com</div>
                            <div class="texto_empresa">SocialPulse</div>
                            <div>
                                <div class="area_usuario">Admin</div>
                            </div>
                            <div>
                                <div class="status_atual_usuario">Ativo</div>
                            </div>
                            <div class="container_acoes">
                                <button>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                        class="bi bi-pencil-square" viewBox="0 0 16 16">
                                        <path
                                            d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z" />
                                        <path fill-rule="evenodd"
                                            d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z" />
                                    </svg>
                                </button>
                                <button>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                        class="bi bi-trash3" viewBox="0 0 16 16">
                                        <path
                                            d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
    </section>

</body>
