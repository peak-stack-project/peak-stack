<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PeakStack | Minhas máquinas</title>
    <link rel="icon" href="./assets/react.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="./css/dashboard.css" />
    <script src="./js/sessao.js" defer></script>
</head>

<body class="corpo_dashboard" onload="registrar_checkpoint('acessou_monitoramento_vazio')">

    <!-- Barra lateral (ilha flutuante) -->
 <aside class="menu_lateral">
        <a class="marca marca_lateral">
            <img class="marca_icone" src="./assets/Design sem nome.png" alt="" />
            <span>PeakStack</span>
        </a>
        <div class="menu_grupo">
            <span class="menu_rotulo">Menu</span>
            <a href="./dashboard.html">Visão geral</a>
            <a class="ativo" href="./máquinas.html">Máquinas</a>
            <a href="./cadastroUsuarios.html">Usuários</a>
            <a href="./alertas.html">Alertas</a>
        </div>
        <div class="menu_lateral_rodape">
            <span class="menu_grupo">
                <a href="./index.html">Sair</a>
            </span>
            <button id="btn_logout" class="botao botao_lateral" onclick="limparSessao()">
                Sair
            </button>
        </div>
    </aside>

    <!-- Conteúdo -->
    <main class="conteudo_dashboard conteudo_maquinas">

        <header class="maq_topo">
            <div>
                <h1>Máquinas</h1>
                <p>Gerencie os servidores monitorados</p>
            </div>
            <div class="maq_topo_acoes">
                <button type="button" class="maq_icone_botao" aria-label="Buscar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7" />
                        <path d="m20 20-3.5-3.5" />
                    </svg>
                </button>
                <button type="button" class="maq_icone_botao com_aviso" aria-label="Notificações">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
                        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
                    </svg>
                </button>
            </div>
        </header>

        <div class="maq_barra">
            <div class="maq_filtros" id="filtros" role="group" aria-label="Filtrar por status">
                <button type="button" class="maq_filtro" data-status="online" aria-pressed="false"></button>
                <button type="button" class="maq_filtro" data-status="offline" aria-pressed="false"></button>
                <button type="button" class="maq_filtro" data-status="atencao" aria-pressed="false"></button>
            </div>
            <a class="botao maq_botao_adicionar" href="./CadastrodeVM.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                    aria-hidden="true">
                    <path d="M12 5v14M5 12h14" />
                </svg>
                Adicionar máquina
            </a>
        </div>

        <section class="maq_cartao" aria-label="Lista de máquinas monitoradas">
            <table class="maq_tabela">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Endereço IP</th>
                        <th>Sistema operacional</th>
                        <th>Empresa</th>
                        
                        <th>Status</th>
                        <th><span class="sr-only" style="position:absolute;left:-9999px">Ações</span></th>
                    </tr>
                </thead>
                <tbody id="tabela_maquinas"></tbody>
            </table>
        </section>
    </main>

    <script>
        // Dados de exemplo. Quando a API estiver pronta, troque este array pelo resultado do fetch
        // e chame renderizar() em seguida.
        let maquinas = [
            { id: 1, nome: 'SRV-PROD-01', ip: '192.168.1.10', so: 'Ubuntu 22.04',         empresa: 'Sympla', status: 'online'  },
            { id: 2, nome: 'SRV-PROD-02', ip: '192.168.1.11', so: 'CentOS 8',             empresa: 'Sympla', status: 'atencao' },
            { id: 3, nome: 'SRV-API-01',  ip: '10.0.1.5',     so: 'Debian 11',            empresa: 'Ingresso.com', status: 'online'  },
            { id: 4, nome: 'SRV-DB-01',   ip: '10.0.1.6',     so: 'Windows Server 2022',  empresa: 'Ingresso.com', status: 'offline' }
        ];

        let filtroAtivo = null;

        const ROTULOS = { online: 'Online', atencao: 'Atenção', offline: 'Offline' };
        const ROTULOS_FILTRO = { online: 'online', offline: 'offline', atencao: 'atenção' };

        const ICONES = {
            monitor: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
            online: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="0.5"/></svg>',
            atencao: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
            offline: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9a15 15 0 0 1 5-3M22 9a15 15 0 0 0-8-3.8M5.5 12.5A10 10 0 0 1 9 10.6M18.5 12.5a10 10 0 0 0-2-1.5M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="0.5"/><path d="m2 2 20 20"/></svg>',
            editar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>',
            excluir: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/></svg>'
        };

        // Escapa texto para não injetar HTML caso os dados venham de uma API.
        function esc(texto) {
            const el = document.createElement('div');
            el.textContent = texto;
            return el.innerHTML;
        }

        // < 65% azul | 65–84% laranja | >= 85% vermelho
        function nivel(valor) {
            if (valor === 0) return 'nivel_zero';
            if (valor >= 85) return 'nivel_critico';
            if (valor >= 65) return 'nivel_alerta';
            return 'nivel_ok';
        }

        function medidor(valor) {
            return `<div class="maq_medidor_celula ${nivel(valor)}">
                <span class="maq_medidor"><span class="maq_medidor_barra" style="width:${valor}%"></span></span>
                <span class="maq_pct">${valor}%</span>
            </div>`;
        }

        function linha(m) {
            return `<tr>
                <td><div class="maq_nome"><span class="maq_nome_icone">${ICONES.monitor}</span>${esc(m.nome)}</div></td>
                <td class="maq_ip">${esc(m.ip)}</td>
                <td>${esc(m.so)}</td>
                <td>${esc(m.empresa)}</td>
                <td><span class="maq_status ${m.status}">${ICONES[m.status]}${ROTULOS[m.status]}</span></td>
                <td>
                    <div class="maq_acoes">
                        <a class="maq_icone_botao" href="./CadastrodeVM.html?id=${m.id}" aria-label="Editar ${esc(m.nome)}">${ICONES.editar}</a>
                        <button type="button" class="maq_icone_botao perigo" data-excluir="${m.id}" aria-label="Excluir ${esc(m.nome)}">${ICONES.excluir}</button>
                    </div>
                </td>
            </tr>`;
        }

        function renderizar() {
            // Filtros com contagem
            document.querySelectorAll('.maq_filtro').forEach(btn => {
                const s = btn.dataset.status;
                const qtd = maquinas.filter(m => m.status === s).length;
                btn.textContent = `${qtd} ${ROTULOS_FILTRO[s]}`;
                btn.setAttribute('aria-pressed', String(filtroAtivo === s));
            });

            // Linhas
            const lista = filtroAtivo ? maquinas.filter(m => m.status === filtroAtivo) : maquinas;
            document.getElementById('tabela_maquinas').innerHTML = lista.length
                ? lista.map(linha).join('')
                : '<tr><td colspan="9" class="maq_vazio">Nenhuma máquina encontrada. Use "Adicionar máquina" para cadastrar a primeira.</td></tr>';
        }

        document.getElementById('filtros').addEventListener('click', e => {
            const btn = e.target.closest('.maq_filtro');
            if (!btn) return;
            filtroAtivo = filtroAtivo === btn.dataset.status ? null : btn.dataset.status;
            renderizar();
        });

        document.getElementById('tabela_maquinas').addEventListener('click', e => {
            const btn = e.target.closest('[data-excluir]');
            if (!btn) return;
            const id = Number(btn.dataset.excluir);
            const m = maquinas.find(x => x.id === id);
            if (m && confirm(`Excluir a máquina ${m.nome}?`)) {
                maquinas = maquinas.filter(x => x.id !== id);
                renderizar();
            }
        });

        renderizar();
    </script>
</body>

</html>
