<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PeakStack | Máquinas</title>
    <link rel="icon" href="./assets/react.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="./css/dashboard.css" />
    <link rel="stylesheet" href="./css/cadastro_usuarios.css">
    <script src="./js/sessao.js" defer></script>
    <script src="./js/maquinas_comum.js"></script>
</head>

<body class="corpo_dashboard">

    <aside class="menu_lateral">
        <a class="marca marca_lateral">
            <img class="marca_icone" src="./assets/Design sem nome.png" alt="" />
            <span>PeakStack</span>
        </a>
        <div class="menu_grupo">
            <span class="menu_rotulo">Menu</span>
            <a href="./dashboard_visao_geral.html">Visão geral</a>
            <a href="./alertas.html">Alertas</a>
            <a class="ativo" href="./máquinas.html">Máquinas</a>
            <a href="./cadastro_usuarios.html">Usuários</a>
        </div>
        <div class="menu_lateral_rodape">
            <span class="menu_grupo">
                <a href="./index.html">Sair</a>
            </span>
            <!-- <button id="btn_logout" class="botao botao_lateral" onclick="limparSessao()">
                Sair
            </button> -->
        </div>
    </aside>
    <section class="sessao_cadastro_usuarios">
        <div class="container_cadastro_usuarios">

            <div class="container_inicial">
                <div class="texto_inicial">
                    <h3>Máquinas</h3>
                    <p>Gerencie os servidores monitorados</p>
                </div>
                <div class="container_pesquisa">

                    <button>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="black" class="bi bi-search"
                            viewBox="0 0 16 16">
                            <path
                                d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                        </svg>
                    </button>
                    <button type="button" class="maq_icone_botao com_aviso" aria-label="Notificações">

                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

                            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />

                            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />

                        </svg>

                    </button>

                </div>
            </div>

            <div class="container_interacao_usuarios">
                <div class="container_status_usuarios">
                    <div class="status_usuarios">
                        <p>2 Máquinas Ativos</p>
                    </div>

                </div>

                <button id="botao_cadastro_funcionarios" onclick="chamarCadastro()"> + Adicionar máquina</button>
            </div>
            <div class="container_usuario_ativos">
                <div class="container_tabela">

                    <div class="colunas_tabela">
                        <div class="usuario">NOME</div>
                        <div class="email">ENDEREÇO IP</div>
                        <div class="empresa">SISTEMA OPERACIONAL</div>
                        <div class="perfil">EMPRESA</div>
                        <div class="perfil">COMPONENTE</div>
                        <div class="perfil">STATUS</div>
                        <div></div>
                    </div>
                    <div class="conteudo_tabela" id="lista_usuarios">
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- EDITADO (inicio): cadastro de maquina e de componente com o mesmo container do modal de empresas -->
    <div id="container_cadastro" class="modal_edicao" style="display: none;">
        <section class="modal_edicao_cartao" aria-modal="true" aria-labelledby="tituloCadastroMaquina">
            <header class="modal_edicao_cabecalho">
                <h2 id="tituloCadastroMaquina">Cadastrar máquinas</h2>
                <button class="modal_edicao_fechar" type="button" aria-label="Fechar cadastro" onclick="fechar()">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m6 6 12 12M18 6 6 18"></path>
                    </svg>
                </button>
            </header>
            <div class="form_edicao_empresa">
                <label for="nome_input">Nome do servidor</label>
                <div class="campo_edicao">
                    <input type="text" id="nome_input" placeholder="Ex: SRV-PROD-01">
                </div>
                <div class="alerta_erro">
                    <span id="mensagem_Nome"></span>
                </div>

                <label for="mac_input">Endereço MAC</label>
                <div class="campo_edicao">
                    <input type="text" id="mac_input" placeholder="Ex: AA:BB:CC:DD:EE:FF">
                </div>
                <div class="alerta_erro">
                    <span id="mensagem_MAC"></span>
                </div>

                <label for="so_input">Sistema operacional</label>
                <div class="campo_edicao">
                    <select id="so_input">
                        <option value="1">Windows 11 Home Single Language</option>
                        <option value="2">Linux Ubuntu Server</option>
                    </select>
                </div>

                <div class="acoes_edicao">
                    <button class="botao_cancelar_edicao" type="button" onclick="fechar()">Cancelar</button>
                    <button class="botao_atualizar_edicao" type="button" onclick="cadastrar()">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="m5 12 5 5L20 7"></path>
                        </svg>Adicionar
                    </button>
                </div>
            </div>
        </section>
    </div>

    <div id="container_cadastro2" class="modal_edicao" style="display: none;">
        <section class="modal_edicao_cartao" aria-modal="true" aria-labelledby="tituloCadastroComponente">
            <header class="modal_edicao_cabecalho">
                <h2 id="tituloCadastroComponente">Cadastrar componente</h2>
                <button class="modal_edicao_fechar" type="button" aria-label="Fechar cadastro" onclick="fechar()">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m6 6 12 12M18 6 6 18"></path>
                    </svg>
                </button>
            </header>
            <div class="form_edicao_empresa">
                <label for="componente_input">Componentes monitoradas</label>
                <div class="campo_edicao">
                    <select id="componente_input">
                        <option value="7">CPU (%)</option>
                        <option value="8">CPU (MH)</option>
                        <option value="9">RAM (%)</option>
                        <option value="10">RAM (GB)</option>
                        <option value="11">DISCO (%)</option>
                        <option value="12">REDE (MB)</option>
                        <option value="13">REDE (MB - total)</option>
                        <option value="14">REDE (Mbps)</option>
                    </select>
                </div>

                <label for="status_input">Status</label>
                <div class="campo_edicao">
                    <select id="status_input">
                        <option value="Ativo">Ativo</option>
                        <option value="Não Ativo">Não Ativo</option>
                        <option value="Pendente">Pendente</option>
                    </select>
                </div>

                <div class="acoes_edicao">
                    <button class="botao_cancelar_edicao" type="button" onclick="fechar()">Cancelar</button>
                    <button class="botao_atualizar_edicao" type="button" onclick="cadastrarComponente()">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="m5 12 5 5L20 7"></path>
                        </svg>Cadastrar
                    </button>
                </div>
            </div>
        </section>
    </div>
    <!-- EDITADO (fim) -->
    <div id="modalEdicaoMaquina" class="modal_edicao" style="display: none;">
        <section class="modal_edicao_cartao" aria-modal="true">

            <header class="modal_edicao_cabecalho">
                <h2>Editar máquina</h2>

                <button type="button" class="modal_edicao_fechar" data-fechar-modal>
                    &times;
                </button>
            </header>

            <form id="formEdicaoMaquina" class="form_edicao_empresa">

                <label for="edicaoNomeMaquina">Nome do servidor</label>
                <div class="campo_edicao">
                    <input id="edicaoNomeMaquina" name="nome" type="text">
                </div>

                <label for="edicaoMacMaquina">Endereço MAC</label>
                <div class="campo_edicao">
                    <input id="edicaoMacMaquina" name="mac" type="text">
                </div>

                <label for="edicaoSoMaquina">Sistema operacional</label>
                <div class="campo_edicao">
                    <select id="edicaoSoMaquina" name="sistema_operacional">
                        <option value="1">Windows 11 Home Single Language</option>
                        <option value="2">Linux Ubuntu Server</option>
                    </select>
                </div>

                <div class="acoes_edicao">

                    <button class="botao_cancelar_edicao" type="button" data-fechar-modal>
                        Cancelar
                    </button>

                    <button class="botao_atualizar_edicao" type="submit">
                        Atualizar máquina
                    </button>

                </div>

            </form>
        </section>
    </div>
</body>

</html>
<script>

    var cadastro_realizado = false;

    function listarMaquinas() {
        fetch("/maquinas/listarMaquinas")
            .then(function (resposta) {
                resposta.json().then(function (json) {

                    let htmlCodigo = "";

                    for (let i = 0; i < json.length; i++) {

                        htmlCodigo += `
                        <div class="linha_tabela">

                            <div class="campo_usuario">
                                <div>${json[i].nome}/</div>
                            </div>

                            <div class="texto_email">
                                ${json[i].mac}
                            </div>

                            <div class="texto_empresa">
                                ${json[i].sistema_operacional}
                            </div>

                            <div>
                                <div class="area_usuario">
                                    ${json[i].nome_fantasia}
                                </div>
                            </div>
                            <div>
                                <div class="area_usuario">
                                    ${json[i].componente}
                                </div>
                            </div>
                            <div>
                                <div class="status_atual_usuario">
                                    ${json[i].status}
                                </div>
                            </div>

                            <div class="container_acoes">
                              <button onclick="editarMaquina(${json[i].id})" type="button">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
        fill="currentColor" viewBox="0 0 16 16">
        <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
    </svg>
</button>

                                <button>
                                    <!-- Botão de excluir -->
                                </button>
                            </div>

                        </div>
                    `;
                    }

                    lista_usuarios.innerHTML = htmlCodigo;

                });
            })
            .catch(function (erro) {
                console.error("Erro ao listar máquinas:", erro);
            });
    }

    listarMaquinas();

    const modalMaquina = document.getElementById("modalEdicaoMaquina");

    let idMaquina;

    function editarMaquina(id) {

        idMaquina = id;

        fetch(`/maquinas/buscar/${id}`)
            .then(function (resposta) {
                return resposta.json();
            })
            .then(function (json) {

                edicaoNomeMaquina.value = json.nome;
                edicaoMacMaquina.value = json.mac;
                edicaoSoMaquina.value = json.sistema_operacional;

                modalMaquina.style.display = "flex";

            })
            .catch(function (erro) {
                console.error("Erro ao buscar máquina:", erro);
            });
    }

    function fecharModalMaquina() {
        modalMaquina.style.display = "none";
    }

    document.querySelectorAll("#modalEdicaoMaquina [data-fechar-modal]")
        .forEach(function (botao) {
            botao.addEventListener("click", fecharModalMaquina);
        });

    document.getElementById("formEdicaoMaquina")
        .addEventListener("submit", function (event) {

            event.preventDefault();

            let nome = edicaoNomeMaquina.value;
            let mac = edicaoMacMaquina.value;
            let so = edicaoSoMaquina.value;

            if (nome.length < 3) {
                alert("Nome da máquina inválido.");
                return;
            }

            if (mac == "") {
                alert("Informe o endereço MAC.");
                return;
            }

            fetch(`/maquinas/atualizar/${idMaquina}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nome: nome,
                    mac: mac,
                    fk_so: so
                })
            })
                .then(function (resposta) {

                    if (resposta.ok) {
                        alert("Máquina atualizada com sucesso!");

                        fecharModalMaquina();
                        listarMaquinas();

                    } else {
                        alert("Erro ao atualizar máquina.");
                    }

                })
                .catch(function (erro) {
                    console.error("Erro ao atualizar máquina:", erro);
                });

        });

    function cadastrarComponente() {
        console.log("chamei a funcao cadastrar");
        let booleano = true;
        var componenteVar = componente_input.value;
        var statusVar = status_input.value;
        var idMaquinaVar = sessionStorage.getItem("ID_MAQUINA");
        console.log(componenteVar)
        console.log(statusVar)
        console.log(idMaquinaVar)

        // aguardar();

        if (
            componenteVar == "" ||
            statusVar == ""
        ) {
            booleano = false;
        }

        console.log(componenteVar)
        console.log(statusVar)
        console.log(idMaquinaVar)
        console.log(booleano)

        if (booleano == true) {
            fetch("/maquinas/cadastrarComponente", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({

                    // crie um atributo que recebe o valor recuperado aqui
                    // Agora vá para o arquivo routes/usuario.js
                    commponenteServer: componenteVar,
                    statusServer: statusVar,
                    idMaquinaServer: idMaquinaVar

                }),

            })
                .then(function (resposta) {
                    console.log("chamei as variavel");
                    console.log("resposta: ", resposta);

                    if (resposta.ok) {
                        console.log("resposta ok");
                        container_cadastro.style.display = 'none';
                        container_cadastro2.style.display = 'flex';
                        limparFormulario();
                        finalizarAguardar();

                    } else {
                        throw "Houve um erro ao tentar realizar o cadastro!";
                    }
                })
                .catch(function (resposta) {
                    console.log(`#ERRO: ${resposta}`);
                    finalizarAguardar();
                });

            return false;
        }
    }

    function mudarTela() {
        document.getElementById('btnProximo').addEventListener('click', function () {
            var cadastroEmpresa = document.getElementById('cadastroEmpresa');
            var cadastroADM = document.getElementById('cadastroADM');

            if (cadastroEmpresa && cadastroADM) {

            }
        });

    }

    function cadastrar() {
        console.log("chamei a funcao cadastrar");
        let booleano = true;
        var nomeVar = nome_input.value;
        var macVar = mac_input.value;
        var soVar = so_input.value;
        var emailVar = "opa";
        var senhaVar = "opa";
        var idEmpresaVar = sessionStorage.getItem("FKEMPRESA_USUARIO");
        var nomeUsuarioVar = sessionStorage.getItem("NOME_USUARIO")
        console.log(soVar)
        console.log(nomeUsuarioVar)
        console.log(idEmpresaVar)

        // aguardar();

        if (
            nomeVar == "" ||
            macVar == "" ||
            soVar == ""
        ) {
            booleano = false;
            mensagem_Nome.style.display = "block";
            mac_input.style.background = "#FFE9E5";
            nome_input.style.background = "#FFE9E5";
            mensagem_Nome.style.color = "#FC1600";
            mensagem_Nome.innerHTML = "Não deixe os campos em branco!";
            mensagem_MAC.innerHTML = "Não deixe os campos em branco!";
        }

        if (macVar.length != 12) {
            mensagem_MAC.style.display == "block";
            mensagem_MAC.innerHTML = "O endereço tem " + macVar.length + " caracteres, mas deve ter 12.";
            mensagem_MAC.style.color = "#FC1600";
            mac_input.style.background = "#FFE9E5";

        } else {

            console.log(nomeVar)
            console.log(soVar)
            console.log(macVar)
            console.log(booleano)

            if (booleano == true) {
                fetch("/maquinas/cadastrarMaquina", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({

                        // crie um atributo que recebe o valor recuperado aqui
                        // Agora vá para o arquivo routes/usuario.js
                        nomeServer: nomeVar,
                        macServer: macVar,
                        soServer: soVar,
                        idEmpresaServer: idEmpresaVar,
                        nomeUsuarioServer: nomeUsuarioVar

                    }),

                })
                    .then(function (resposta) {
                        console.log("chamei as variavel");
                        console.log("resposta: ", resposta);

                        if (resposta.ok) {
                            console.log("resposta ok");
                            container_cadastro.style.display = 'none';
                            container_cadastro2.style.display = 'flex';
                            limparFormulario();
                            finalizarAguardar();

                        } else {
                            throw "Houve um erro ao tentar realizar o cadastro!";
                        }
                    })
                    .catch(function (resposta) {
                        console.log(`#ERRO: ${resposta}`);
                        finalizarAguardar();
                    });

                fetch("/maquinas/listar", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ emailServer: emailVar, senhaServer: senhaVar })
                }).then(function (resposta) {
                    if (resposta.ok) {
                        resposta.json().then(function (json) {
                            sessionStorage.ID_MAQUINA = json.id;
                            fez_login = true;
                        });
                    } else {

                        if (resposta.status == 403) {
                            cardErro.style.display = "block";
                            cardErro.style.color = "#FC1600";
                            mensagem_MAC.innerHTML = "E-mail ou senha incorretos";
                        } else if (resposta.status == 500) {
                            cardErro.style.display = "block";
                            cardErro.style.color = "#FC1600";
                            mensagem_MAC.innerHTML = "Erro no servidor. Tente novamente mais tarde.";
                        } else {
                            cardErro.style.display = "block";
                            cardErro.style.color = "#FC1600";
                            mensagem_MAC.innerHTML = "Não foi possível fazer o login. Tente novamente.";
                        }
                    }
                }).catch(function () {
                    // cardErro.style.display = "block";
                    // mensagem_MAC.innerHTML = "Falha na conexão com o servidor.";
                    finalizarAguardar();
                    // registrar_checkpoint("falha_conexao_login_peakstack");
                });

                return false;
            }
        }
    }

    function chamarCadastro() {
        const container = document.getElementById("container_cadastro");
        const container2 = document.getElementById("container_cadastro2");

        if (container.style.display === "none") {
            container.style.display = "flex";
            container2.style.display = "none";
        } else {
            container.style.display = "none";
            container2.style.display = "flex";

        }

    }

    function fechar() {
        document.getElementById("container_cadastro").style.display = "none";
        document.getElementById("container_cadastro2").style.display = "none";
    }

</script>
