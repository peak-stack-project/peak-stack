    <section class="sessao_cadastro_usuarios">
        <div class="container_cadastro_usuarios">

            <div class="container_inicial">
                <div class="texto_inicial">

                </div>
                <div class="container_pesquisa">

                    <button>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="black" class="bi bi-search"
                            viewBox="0 0 16 16">
                            <path
                                d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                        </svg>
                    </button>
                    <button type="button" class="maq_icone_botao com_aviso" aria-label="Notificações">

                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

                            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />

            <div class="container_interacao_usuarios">

                    </div>

                </div>

                <button id="botao_cadastro_funcionarios" onclick="chamarCadastro()"> + Adicionar máquina</button>
            </div>
            <div class="container_usuario_ativos">

                    <div class="colunas_tabela">
                        <div class="usuario">NOME</div>
                        <div class="email">ENDEREÇO IP</div>
                        <div class="empresa">SISTEMA OPERACIONAL</div>
                        <div class="perfil">EMPRESA</div>
                        <div class="perfil">STATUS</div>
                        <div></div>
                    </div>
                    <div class="conteudo_tabela" id="lista_usuarios">
                    </div>
                </div>

    <section>

        <div id="container_cadastro" style="display: none;">
            <div class="sessao_cadastro">
                <div class="container_tema">

                    <a href="./máquinas.html">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                            class="bi bi-x-circle" viewBox="0 0 16 16">
                            <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16" />
                            <path

                        </svg>

                <div class="nome_usuario">
                    <h4>Nome do servidor</h4>

                <div class="email_usuario">

                    </div>
                </div>
                <div class="senha">

                </div>
            </div>
        </div>
    </section>

    <section>
        <div id="container_cadastro2" style="display: none;">
            <div class="sessao_cadastro2">
                <div class="container_empresa_usuario">
                    <h4>Componentes monitoradas</h4>
                    <select name="" id="componente_input">
                        <option value="7">CPU (%)</option>
                        <option value="8">CPU (MH)</option>
                        <option value="9">RAM (%)</option>
                        <option value="10">RAM (GB)</option>
                        <option value="11">DISCO (%)</option>
                        <option value="12">REDE (MB)</option>
                        <option value="13">REDE (MB - total)</option>
                        <option value="14">REDE (Mbps)</option>

                    </select>
                </div>
                <div class="container_atividade_usuario">
                    <h4>Status</h4>
                    <select name="" id="status_input">
                        <option value="Ativo">Ativo</option>
                        <option value="Não Ativo">Não Ativo</option>

                    </select>
                </div>
                <div class="botoes_modal_cadastro">
                    <button class="botao_cancelar_cadastro_usuario" onclick="fechar()">Cancelar</button>
                    <button class="botao_cadastrar_usuario" onclick="cadastrarComponente()">Cadastrar</button>

    <div id="modalEdicaoMaquina" class="modal_edicao" style="display: none;">
        <section class="modal_edicao_cartao" aria-modal="true">

            <header class="modal_edicao_cabecalho">
                <h2>Editar máquina</h2>

                <button type="button" class="modal_edicao_fechar" data-fechar-modal>
                    &times;
                </button>
            </header>

            <form id="formEdicaoMaquina" class="form_edicao_empresa">

                <label for="edicaoNomeMaquina">Nome do servidor</label>
                <div class="campo_edicao">
                    <input id="edicaoNomeMaquina" name="nome" type="text">
                </div>

                <label for="edicaoMacMaquina">Endereço MAC</label>
                <div class="campo_edicao">
                    <input id="edicaoMacMaquina" name="mac" type="text">
                </div>

                <label for="edicaoSoMaquina">Sistema operacional</label>
                <div class="campo_edicao">
                    <select id="edicaoSoMaquina" name="sistema_operacional">
                        <option value="1">Windows 11 Home Single Language</option>
                        <option value="2">Linux Ubuntu Server</option>
                    </select>
                </div>

                <div class="acoes_edicao">

                    <button class="botao_cancelar_edicao" type="button" data-fechar-modal>
                        Cancelar
                    </button>

                    <button class="botao_atualizar_edicao" type="submit">
                        Atualizar máquina
                    </button>

                </div>

            </form>
        </section>
    </div>
</body>

</html>
<script>

    var cadastro_realizado = false;

    function listarMaquinas() {
        fetch("/maquinas/listarMaquinas")
            .then(function (resposta) {
                resposta.json().then(function (json) {

                    let htmlCodigo = "";

                    for (let i = 0; i < json.length; i++) {

                        htmlCodigo += `
                        <div class="linha_tabela">

                            <div class="campo_usuario">
                                <div>${json[i].nome}</div>
                            </div>

                            <div class="texto_email">
                                ${json[i].mac}
                            </div>

                            <div class="texto_empresa">
                                ${json[i].sistema_operacional}
                            </div>

                            <div>
                                <div class="area_usuario">
                                    ${json[i].nome_fantasia}
                                </div>
                            </div>

                            <div>
                                <div class="status_atual_usuario">
                                    ${json[i].status}
                                </div>
                            </div>

                            <div class="container_acoes">
                              <button onclick="editarMaquina(${json[i].id})" type="button">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
        fill="currentColor" viewBox="0 0 16 16">
        <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
    </svg>
</button>

                                <button>
                                    <!-- Botão de excluir -->
                                </button>
                            </div>

                        </div>
                    `;
                    }

                    lista_usuarios.innerHTML = htmlCodigo;

                });
            })
            .catch(function (erro) {
                console.error("Erro ao listar máquinas:", erro);
            });
    }

    listarMaquinas();

    const modalMaquina = document.getElementById("modalEdicaoMaquina");

    let idMaquina;

    function editarMaquina(id) {

        idMaquina = id;

        fetch(`/maquinas/buscar/${id}`)
            .then(function (resposta) {
                return resposta.json();
            })
            .then(function (json) {

                edicaoNomeMaquina.value = json.nome;
                edicaoMacMaquina.value = json.mac;
                edicaoSoMaquina.value = json.sistema_operacional;

                modalMaquina.style.display = "flex";

            })
            .catch(function (erro) {
                console.error("Erro ao buscar máquina:", erro);
            });
    }

    function fecharModalMaquina() {
        modalMaquina.style.display = "none";
    }

    document.querySelectorAll("#modalEdicaoMaquina [data-fechar-modal]")
        .forEach(function (botao) {
            botao.addEventListener("click", fecharModalMaquina);
        });

    document.getElementById("formEdicaoMaquina")
        .addEventListener("submit", function (event) {

            event.preventDefault();

            let nome = edicaoNomeMaquina.value;
            let mac = edicaoMacMaquina.value;
            let so = edicaoSoMaquina.value;

            if (nome.length < 3) {
                alert("Nome da máquina inválido.");
                return;
            }

            if (mac == "") {
                alert("Informe o endereço MAC.");
                return;
            }

            fetch(`/maquinas/atualizar/${idMaquina}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nome: nome,
                    mac: mac,
                    fk_so: so
                })
            })
                .then(function (resposta) {

                    if (resposta.ok) {
                        alert("Máquina atualizada com sucesso!");

                        fecharModalMaquina();
                        listarMaquinas();

                    } else {
                        alert("Erro ao atualizar máquina.");
                    }

                })
                .catch(function (erro) {
                    console.error("Erro ao atualizar máquina:", erro);
                });

        });

    function cadastrarComponente() {
        console.log("chamei a funcao cadastrar");
        let booleano = true;
        var componenteVar = componente_input.value;
        var statusVar = status_input.value;
        var idMaquinaVar = sessionStorage.getItem("ID_MAQUINA");
        console.log(componenteVar)
        console.log(statusVar)
        console.log(idMaquinaVar)

        // aguardar();

        if (
            componenteVar == "" ||
            statusVar == ""
        ) {
            booleano = false;
        }

        console.log(componenteVar)
        console.log(statusVar)
        console.log(idMaquinaVar)
        console.log(booleano)

        if (booleano == true) {
            fetch("/maquinas/cadastrarComponente", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({

                    // crie um atributo que recebe o valor recuperado aqui
                    // Agora vá para o arquivo routes/usuario.js
                    commponenteServer: componenteVar,
                    statusServer: statusVar,
                    idMaquinaServer: idMaquinaVar

                }),

            })
                .then(function (resposta) {
                    console.log("chamei as variavel");
                    console.log("resposta: ", resposta);

                    if (resposta.ok) {
                        console.log("resposta ok");
                        container_cadastro.style.display = 'none';
                        container_cadastro2.style.display = 'flex';
                        limparFormulario();
                        finalizarAguardar();

                    } else {
                        throw "Houve um erro ao tentar realizar o cadastro!";
                    }
                })
                .catch(function (resposta) {
                    console.log(`#ERRO: ${resposta}`);
                    finalizarAguardar();
                });

            return false;
        }
    }

    function mudarTela() {
        document.getElementById('btnProximo').addEventListener('click', function () {
            var cadastroEmpresa = document.getElementById('cadastroEmpresa');
            var cadastroADM = document.getElementById('cadastroADM');

            if (cadastroEmpresa && cadastroADM) {

            }

    function cadastrar() {
        console.log("chamei a funcao cadastrar");
        let booleano = true;
        var nomeVar = nome_input.value;
        var macVar = mac_input.value;
        var soVar = so_input.value;
        var emailVar = "opa";
        var senhaVar = "opa";
        var idEmpresaVar = sessionStorage.getItem("FKEMPRESA_USUARIO");
        var nomeUsuarioVar = sessionStorage.getItem("NOME_USUARIO")
        console.log(soVar)
        console.log(nomeUsuarioVar)
        console.log(idEmpresaVar)

        // aguardar();

        if (
            nomeVar == "" ||

        ) {
            booleano = false;
        }

        console.log(nomeVar)
        console.log(soVar)
        console.log(macVar)
        console.log(booleano)

        if (booleano == true) {
            fetch("/maquinas/cadastrarMaquina", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({

                    // crie um atributo que recebe o valor recuperado aqui

                    nomeServer: nomeVar,
                    macServer: macVar,
                    soServer: soVar,
                    idEmpresaServer: idEmpresaVar,
                    nomeUsuarioServer: nomeUsuarioVar

                }),

            })
                .then(function (resposta) {
                    console.log("chamei as variavel");
                    console.log("resposta: ", resposta);

                    if (resposta.ok) {
                        console.log("resposta ok");
                        container_cadastro.style.display = 'none';
                        container_cadastro2.style.display = 'flex';

            fetch("/maquinas/listar", {

                headers: { "Content-Type": "application/json" },

            }).then(function (resposta) {

                } else {
                    resposta.text().then(function (texto) {

                        finalizarAguardar();

                    });

            }).catch(function () {
                // cardErro.style.display = "block";
                // mensagem_erro.innerHTML = "Falha na conexão com o servidor.";
                finalizarAguardar();
                // registrar_checkpoint("falha_conexao_login_peakstack");
            });

            return false;
        }
    }

    function chamarCadastro() {
        const container = document.getElementById("container_cadastro");
        const container2 = document.getElementById("container_cadastro2");

        if (container.style.display === "none") {
            container.style.display = "flex";
            container2.style.display = "none";
        } else {
            container.style.display = "none";
            container2.style.display = "flex";

        }

    }

    function fechar() {
        document.getElementById("container_cadastro").style.display = "none";
        document.getElementById("container_cadastro2").style.display = "none";
    }

</script>
